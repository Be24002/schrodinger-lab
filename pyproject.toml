[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sqm"
version = "0.1.0"
description = "Numerical quantum mechanics from scratch: Crank-Nicolson and split-operator wavepacket dynamics, harmonic-oscillator spectra, quantum tunneling, and coherent states -- validated against exact formulas"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Be24002" }]
keywords = ["physics", "quantum-mechanics", "schrodinger", "numerical-methods", "wavepacket", "tunneling"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
